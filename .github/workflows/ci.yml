name: LiveKick CI

on:
    push:
        branches:
            - main
            - dev
    pull_request:
        branches:
            - main
            - dev
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    detect-project:
        name: Detect available apps
        runs-on: ubuntu-latest
        outputs:
            has_backend: ${{ steps.detect.outputs.has_backend }}
            has_frontend: ${{ steps.detect.outputs.has_frontend }}
            has_ai_service: ${{ steps.detect.outputs.has_ai_service }}
        
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            
            - name: Detect existing folders
              id: detect
              shell: bash
              run: | 
                if [ -f "backend/pom.xml" ]; then
                    echo "has_backend=true" >> "$GITHUB_OUTPUT"
                else
                    echo "has_backend=false" >> "$GITHUB_OUTPUT"
                fi

                if [ -f "frontend/package.json" ]; then
                    echo "has_frontend=true" >> "$GITHUB_OUTPUT"
                else
                    echo "has_frontend=false" >> "$GITHUB_OUTPUT"
                fi

                if [ -f "ai-service/requirements.txt" ]; then
                    echo "has_ai_service=true" >> "$GITHUB_OUTPUT"
                else
                    echo "has_ai_service=false" >> "$GITHUB_OUTPUT"
                fi

    backend:
        name: Backend - Build and test
        runs-on: ubuntu-latest
        needs: detect-project
        if: needs.detect-project.outputs.has_backend == 'true'

        defaults:
            run:
                working-directory: backend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Java 21
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: 21
                cache: maven

            - name: Make Maven wrapper executable
              # Useful when the wrapper was created on Windows before being pushed.
              run: chmod +x mvnw

            - name: Build backend
              run: ./mvnw --batch-mode verify

    frontend:
        name: Frontend - Building
        runs-on: ubuntu-latest
        needs: detect-project
        if: needs.detect-project.outputs.has_frontend == 'true'

        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js 22
              uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm
                cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build frontend
              run: npm run build

    ai-service:
        name: AI service - Validate
        runs-on: ubuntu-latest
        needs: detect-project
        if: needs.detect-project.outputs.has_ai_service == 'true'

        defaults:
            run:
                working-directory: ai-service

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python 3.12
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'
                cache: pip
                cache-dependency-path: ai-service/requirements.txt

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Compile service
              run: python -m compileall app
