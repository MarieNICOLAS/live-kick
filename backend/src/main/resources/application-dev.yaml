spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/livekick}
    username: ${SPRING_DATASOURCE_USERNAME:livekick}
    password: ${SPRING_DATASOURCE_PASSWORD:livekick}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

logging:
  level:
    com.livekick: DEBUG
    org.hibernate.SQL: DEBUG
