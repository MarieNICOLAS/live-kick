spring:
  application:
    name: livekick-backend
  profiles:
    default: dev

  jpa:
    open-in-view: false

  flyway:
    locations: classpath:db/migration

server:
  port: ${BACKEND_PORT:8080}

app:
  api:
    base-path: /api/v1
  cors:
    allowed-origins: ${BACKEND_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:replace-with-a-strong-secret-of-at-least-32-characters}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
