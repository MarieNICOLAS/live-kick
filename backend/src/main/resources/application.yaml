spring:
  application:
    name: livekick-backend
  profiles:
    default: dev

  sql:
    init:
      mode: always
      schema-locations: classpath:db/sqlite/schema.sql

server:
  port: ${BACKEND_PORT:8080}

app:
  api:
    base-path: /api/v1
  cors:
    allowed-origins: ${BACKEND_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:replace-with-a-strong-secret-of-at-least-32-characters}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
  world-cup-2026-api:
    base-url: ${WORLD_CUP_2026_API_BASE_URL:https://worldcup26.ir}
    bearer-token: ${WORLD_CUP_2026_API_BEARER_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
