services:
  backend:
    profiles: ["app"]
    build:
      context: ./backend
    container_name: livekick-backend
    environment:
      BACKEND_PORT: 8080
      LIVEKICK_SQLITE_PATH: /data/livekick.db
      BACKEND_CORS_ALLOWED_ORIGINS: ${BACKEND_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-strong-secret-of-at-least-32-characters}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      WORLD_CUP_2026_API_BASE_URL: ${WORLD_CUP_2026_API_BASE_URL:-https://worldcup26.ir}
      WORLD_CUP_2026_API_BEARER_TOKEN: ${WORLD_CUP_2026_API_BEARER_TOKEN:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - sqlite_data:/data
    depends_on:
      ai-service:
        condition: service_started

  frontend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: livekick-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

  ai-service:
    profiles: ["app"]
    build:
      context: ./ai-service
    container_name: livekick-ai-service
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"

volumes:
  sqlite_data:
